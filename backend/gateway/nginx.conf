worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;

    upstream auth_service { server auth-service:8000; }
    upstream restaurant_service { server restaurant-service:8000; }
    upstream order_service { server order-service:8000; }
    upstream payment_service { server payment-service:8000; }
    upstream delivery_service { server delivery-service:8000; }

    server {
        listen 80;

        # Prefix matching without trailing slashes for better compatibility
        location /api/v1/auth {
            proxy_pass http://auth_service;
        }

        location /api/v1/admin/users {
            proxy_pass http://auth_service;
        }

        location /api/v1/admin/analytics {
            proxy_pass http://order_service;
        }

        location /api/v1/admin/restaurants {
            proxy_pass http://restaurant_service;
        }

        location /api/v1/admin/summary {
            proxy_pass http://restaurant_service;
        }

        location /api/v1/customers {
            proxy_pass http://order_service;
        }

        location /api/v1/restaurants {
            proxy_pass http://restaurant_service;
        }

        location /api/v1/menu-items {
            proxy_pass http://restaurant_service;
        }

        location /api/v1/suppliers {
            proxy_pass http://restaurant_service;
        }

        location /api/v1/imports {
            proxy_pass http://restaurant_service;
        }

        location /api/v1/orders {
            proxy_pass http://order_service;
        }

        location /api/v1/expenses {
            proxy_pass http://order_service;
        }

        location /api/v1/payments {
            proxy_pass http://payment_service;
        }

        location /api/v1/deliveries {
            proxy_pass http://delivery_service;
        }

        location /api/v1/disputes {
            proxy_pass http://order_service;
        }

        location /api/v1/users {
            proxy_pass http://auth_service;
        }

        location /ws/ {
            proxy_pass http://delivery_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
